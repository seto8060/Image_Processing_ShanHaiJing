[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rain_harmonizer"
version = "0.1.0"
description = "High-resolution Image Harmonization using RainNet and Guided Filter"
requires-python = ">=3.8"
dependencies = [
    "torch>=1.7.0",
    "torchvision>=0.8.0",
    "numpy",
    "opencv-python", 
    "Pillow"
]

[tool.setuptools.packages.find]
where = ["src"]